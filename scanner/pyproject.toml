[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-scanner"
version = "0.1.0"
description = "Detection engine for Aegis-Web"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "playwright",
    "beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_scanner*"]
